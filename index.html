<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="../p-main-1/public/Group 45.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="ProShelf — a estante inteligente do professor. Cronogramas, turmas, arquivos e calendário escolar em um só lugar." />
  <title>ProShelf</title>

  <!-- Fontes: um único request otimizado (substitui os ~12 @import bloqueantes espalhados nos CSS) -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- 2. Faz o preload do CSS da fonte com alta prioridade -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap">

  <!-- 3. Carrega o CSS de forma assíncrona (não bloqueia a renderização da tela) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" media="print"
    onload="this.media='all'">
</head>

<body>

  <div id="root" ></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script> -->
<!-- new window.VLibras.Widget({ -->
    <!-- rootPath: 'https://vlibras.gov.br/app',
    position: 'L' // 'L' para Esquerda (Left) ou 'R' para Direita (Right)
  }); -->
  </script>

  <script>
  (function() {
    try {
      var temaAtivo = false;
      var encontrouPreferencias = false;

      // 1. Verifica se existe o tema legado primeiro
      var legado = localStorage.getItem('darkMode');
      if (legado !== null) {
        temaAtivo = (legado === 'true');
        encontrouPreferencias = true;
      } else {
        // 2. Procura pela preferência de algum usuário salvo (já que não temos o UID ainda)
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && key.indexOf('proshelf:dark-mode:') === 0) {
            temaAtivo = (localStorage.getItem(key) === 'true');
            encontrouPreferencias = true;
            break; // Aplica a preferência do primeiro usuário que encontrar
          }
        }
      }

      // 3. Se o usuário nunca configurou nada, segue a cor do sistema operacional
      if (!encontrouPreferencias) {
        temaAtivo = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      // Aplica a classe imediatamente, bloqueando o "flash branco"
      if (temaAtivo) {
        document.documentElement.classList.add('dark-mode');
      }
    } catch (e) {}
  })();
</script>

</body>

</html>
